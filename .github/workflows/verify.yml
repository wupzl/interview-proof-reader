name: Verify interview reader
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python build.py
      - run: git diff --exit-code docs chapters/00-全书导航.md
      - run: python verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interview-reader-screenshots
          path: test-results/
